<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Secret Scrapbook 📖</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #1a0b12; /* Dark romantic bg */
            font-family: 'Playfair Display', serif;
            color: #4A252C;
        }

        .font-handwriting { font-family: 'Caveat', cursive; }

        /* --- 1. Lock Screen --- */
        #lock-screen {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, #2a111a 0%, #0a0306 100%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 1s ease, transform 1s ease;
        }
        .lock-box {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 182, 193, 0.2);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        /* --- 2. Scrapbook Aesthetic --- */
        #book-container {
            display: none;
            width: 100vw;
            height: 100vh;
            align-items: center;
            justify-content: center;
            background: url('https://www.transparenttextures.com/patterns/stardust.png') #2a111a;
        }

        .journal-page {
            width: 90%;
            max-width: 450px;
            height: 85vh;
            max-height: 700px;
            background: #fbf5e9; /* Old paper color */
            background-image: url('https://www.transparenttextures.com/patterns/paper-fibers.png');
            border-radius: 5px 25px 25px 5px;
            position: relative;
            box-shadow: 15px 15px 40px rgba(0,0,0,0.4), inset -5px 0 15px rgba(0,0,0,0.05);
            transform-origin: left center;
            transform-style: preserve-3d;
        }

        /* Leather Spine Binding */
        .journal-spine {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 40px;
            background: linear-gradient(to right, #4a2121 0%, #6b2d2d 20%, #4a2121 100%);
            border-radius: 5px 0 0 5px;
            box-shadow: 5px 0 10px rgba(0,0,0,0.3);
            z-index: 10;
        }
        .spine-stitch {
            width: 20px;
            height: 4px;
            background: #d4c4b7;
            margin: 30px auto;
            border-radius: 2px;
            box-shadow: 0 2px 3px rgba(0,0,0,0.5);
        }

        /* Ribbon & Hanging Photos */
        .ribbon {
            position: absolute;
            top: 25%;
            left: 30px; /* starts past spine */
            right: -5px;
            height: 22px;
            background: linear-gradient(to bottom, #d93856 0%, #ed5572 50%, #d93856 100%);
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            z-index: 15;
            transform: rotate(-2deg);
        }
        .ribbon::before, .ribbon::after {
            content: '';
            position: absolute;
            background: rgba(0,0,0,0.2);
            width: 10px;
            height: 100%;
        }

        .hanging-photo-container {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translateX(-50%) rotate(-3deg);
            z-index: 20;
            transform-origin: top center;
            animation: gentleSwing 4s ease-in-out infinite alternate;
        }

        @keyframes gentleSwing {
            0% { transform: translateX(-50%) rotate(-3deg); }
            100% { transform: translateX(-50%) rotate(3deg); }
        }

        /* The Pin holding the photo to the ribbon */
        .push-pin {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 16px;
            background: radial-gradient(circle at 30% 30%, #ffd700, #b8860b);
            border-radius: 50%;
            box-shadow: -2px 4px 4px rgba(0,0,0,0.4), inset -2px -2px 4px rgba(0,0,0,0.2);
            z-index: 25;
        }
        .push-pin::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 7px;
            width: 2px;
            height: 8px;
            background: #555;
            z-index: -1;
        }

        .polaroid {
            background: white;
            padding: 12px 12px 35px 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border-radius: 2px;
            width: 240px;
            height: 260px;
            display: flex;
            flex-direction: column;
            margin-top: 5px;
        }
        
        .polaroid img, .polaroid video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #eee;
            border: 1px solid #ddd;
        }

        /* Page Flip Animation */
        .page-flip-out { animation: turnPageOut 0.7s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        .page-flip-in { animation: turnPageIn 0.7s cubic-bezier(0.4, 0, 0.2, 1) forwards; }

        @keyframes turnPageOut {
            0% { transform: perspective(1500px) rotateY(0deg); opacity: 1; }
            100% { transform: perspective(1500px) rotateY(-90deg); opacity: 0; }
        }
        @keyframes turnPageIn {
            0% { transform: perspective(1500px) rotateY(90deg); opacity: 0; }
            100% { transform: perspective(1500px) rotateY(0deg); opacity: 1; }
        }

        /* --- 3. Final Heart Canvas --- */
        #heart-stage {
            position: fixed;
            inset: 0;
            background: black;
            z-index: 200;
            display: none;
            opacity: 0;
            transition: opacity 2s ease;
        }
    </style>
</head>
<body>

    <!-- Background Audio -->
    <audio id="bg-music" loop></audio>

    <!-- ========================================== -->
    <!-- STAGE 1: SECRET LOCK SCREEN                -->
    <!-- ========================================== -->
    <div id="lock-screen">
        <div class="lock-box">
            <h1 class="text-3xl font-bold text-pink-200 mb-2 font-serif-romantic">Secret Scrapbook</h1>
            <p class="text-pink-300/70 text-sm mb-6">Enter the password to unlock.</p>
            
            <input type="password" id="passcode-input" placeholder="Hint: forever" 
                   class="w-full bg-black/40 border border-pink-500/50 text-pink-100 text-center px-4 py-3 rounded-xl focus:outline-none focus:border-pink-400 mb-4 tracking-widest uppercase">
            
            <p id="error-msg" class="text-red-400 text-xs h-4 mb-4 opacity-0 transition-opacity">Incorrect code. Try again!</p>
            
            <button onclick="checkPasscode()" class="w-full bg-gradient-to-r from-rose-500 to-pink-600 hover:from-rose-400 hover:to-pink-500 text-white font-bold py-3 rounded-xl shadow-[0_0_15px_rgba(244,63,94,0.4)] transition transform active:scale-95">
                Unlock 🗝️
            </button>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- STAGE 2: SCRAPBOOK PAGE                    -->
    <!-- ========================================== -->
    <div id="book-container">
        
        <div id="journal-page" class="journal-page">
            <!-- Spine -->
            <div class="journal-spine">
                <div class="spine-stitch mt-8"></div>
                <div class="spine-stitch"></div>
                <div class="spine-stitch"></div>
                <div class="spine-stitch"></div>
                <div class="spine-stitch"></div>
                <div class="spine-stitch"></div>
            </div>

            <!-- Ribbon -->
            <div class="ribbon"></div>

            <!-- Hanging Polaroid -->
            <div class="hanging-photo-container">
                <div class="push-pin"></div>
                <div class="polaroid">
                    <img id="media-img" class="hidden" src="" alt="Memory">
                    <video id="media-vid" class="hidden" loop muted playsinline></video>
                </div>
            </div>

            <!-- Hand-written Caption (positioned below the hanging photo) -->
            <div class="absolute bottom-24 left-12 right-6 text-center">
                <p id="page-caption" class="font-handwriting text-3xl font-bold text-rose-950 leading-snug">
                    Caption goes here
                </p>
            </div>

            <!-- Controls -->
            <div class="absolute bottom-6 left-14 right-6 flex items-center justify-between">
                <button id="prev-btn" onclick="turnPage(-1)" class="px-4 py-2 text-rose-700 font-bold hover:bg-rose-200/50 rounded-full transition opacity-0 pointer-events-none">
                    ← Back
                </button>
                <span class="text-xs font-bold text-rose-400 uppercase tracking-widest">Page <span id="page-num">1</span></span>
                <button id="next-btn" onclick="turnPage(1)" class="px-5 py-2 bg-rose-500 text-white font-bold rounded-full shadow-md hover:bg-rose-600 transition active:scale-95">
                    Next →
                </button>
            </div>
        </div>

    </div>

    <!-- ========================================== -->
    <!-- STAGE 3: IMPROVED MATH HEART               -->
    <!-- ========================================== -->
    <div id="heart-stage">
        <canvas id="heartCanvas" class="w-full h-full"></canvas>
    </div>

    <script>
        /* =========================================================================
           📝 CONFIGURATION: EDIT YOUR SCRAPBOOK HERE
           ========================================================================= */
        const CONFIG = {
            // The secret password to unlock the book (UPPERCASE)
            passcode: "FOREVER", 

            // Background music
            musicSrc: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3", 
            
            // Your Scrapbook Pages (Add as many as you want)
            pages: [
                {
                    type: "image",
                    src: "https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=600&q=80",
                    text: "Our story begins here... ✨💖"
                },
                {
                    type: "video",
                    src: "https://www.w3schools.com/html/mov_bbb.mp4", 
                    text: "Always making me smile 😂💕"
                },
                {
                    type: "image",
                    src: "https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?auto=format&fit=crop&w=600&q=80",
                    text: "I cherish every moment with you 🥂"
                }
            ],
            
            // Final Page Heart Text
            heartText: "I love you"
        };

        let currentPageIndex = 0;
        let isAnimating = false;

        // --- 1. Passcode Logic ---
        function checkPasscode() {
            const input = document.getElementById('passcode-input').value.trim().toUpperCase();
            const errorMsg = document.getElementById('error-msg');
            
            if (input === CONFIG.passcode) {
                // Success! Fade out lock screen
                errorMsg.style.opacity = '0';
                const lockScreen = document.getElementById('lock-screen');
                lockScreen.style.transform = 'scale(1.1)';
                lockScreen.style.opacity = '0';
                
                setTimeout(() => {
                    lockScreen.style.display = 'none';
                    openBook();
                }, 1000);
            } else {
                // Fail
                errorMsg.style.opacity = '1';
                document.getElementById('passcode-input').value = '';
            }
        }

        // Allow pressing Enter to unlock
        document.getElementById('passcode-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkPasscode();
        });

        // --- 2. Book Logic ---
        function openBook() {
            // Play music
            const audio = document.getElementById('bg-music');
            audio.src = CONFIG.musicSrc;
            audio.volume = 0.5;
            audio.play().catch(e => console.log("Audio autoplay prevented"));

            const container = document.getElementById('book-container');
            container.style.display = 'flex';
            
            loadPage(0);
        }

        function loadPage(index) {
            const pageData = CONFIG.pages[index];
            const imgEl = document.getElementById('media-img');
            const vidEl = document.getElementById('media-vid');
            const textEl = document.getElementById('page-caption');
            const pageNumEl = document.getElementById('page-num');

            pageNumEl.textContent = index + 1;
            textEl.textContent = pageData.text;

            if (pageData.type === 'video') {
                imgEl.classList.add('hidden');
                vidEl.classList.remove('hidden');
                vidEl.src = pageData.src;
                vidEl.play();
            } else {
                vidEl.classList.add('hidden');
                vidEl.pause();
                imgEl.classList.remove('hidden');
                imgEl.src = pageData.src;
            }

            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');

            if (index === 0) {
                prevBtn.classList.add('opacity-0', 'pointer-events-none');
            } else {
                prevBtn.classList.remove('opacity-0', 'pointer-events-none');
            }

            if (index === CONFIG.pages.length - 1) {
                nextBtn.innerHTML = "A Secret ✨";
            } else {
                nextBtn.innerHTML = "Next →";
            }
        }

        function turnPage(direction) {
            if (isAnimating) return;
            isAnimating = true;

            const newIndex = currentPageIndex + direction;
            
            if (newIndex === CONFIG.pages.length) {
                triggerFinalHeartPage();
                return;
            }

            const page = document.getElementById('journal-page');
            
            // Flip out
            page.classList.remove('page-flip-in');
            page.classList.add('page-flip-out');

            setTimeout(() => {
                currentPageIndex = newIndex;
                loadPage(currentPageIndex);

                // Flip in
                page.classList.remove('page-flip-out');
                page.classList.add('page-flip-in');
                
                setTimeout(() => { isAnimating = false; }, 700);
            }, 700);
        }

        // --- 3. Improved Heart Canvas Logic ---
        let heartAnimFrameId = null;

        function triggerFinalHeartPage() {
            const stage = document.getElementById('heart-stage');
            stage.style.display = 'block';
            
            // Fade in black screen
            setTimeout(() => {
                stage.style.opacity = '1';
                startTurtleHeartAnimation();
            }, 100);
        }

        function hsvToRgb(h, s, v) {
            let r, g, b, i, f, p, q, t;
            i = Math.floor(h * 6);
            f = h * 6 - i;
            p = v * (1 - s);
            q = v * (1 - f * s);
            t = v * (1 - (1 - f) * s);
            switch (i % 6) {
                case 0: r = v, g = t, b = p; break;
                case 1: r = q, g = v, b = p; break;
                case 2: r = p, g = v, b = t; break;
                case 3: r = p, g = q, b = v; break;
                case 4: r = t, g = p, b = v; break;
                case 5: r = v, g = p, b = q; break;
            }
            return `rgb(${Math.round(r * 255)}, ${Math.round(g * 255)}, ${Math.round(b * 255)})`;
        }

        function startTurtleHeartAnimation() {
            const canvas = document.getElementById('heartCanvas');
            const dpr = window.devicePixelRatio || 1;
            const width = window.innerWidth;
            const height = window.innerHeight;

            canvas.width = width * dpr;
            canvas.height = height * dpr;

            const ctx = canvas.getContext('2d');
            ctx.scale(dpr, dpr);

            const baseUnit = Math.min(width, height) / 500;
            const centerX = width / 2;
            const centerY = height / 2 + (20 * baseUnit);

            const points = [];
            
            // Translate the new upgraded Python math (with color gradient mapping)
            for (let scale = 11; scale <= 16; scale++) {
                // Hue shift from deep red to soft pink (0.95 to 1.05 approx wrapped)
                let hue = 0.95 + (scale - 11) * 0.02;
                let color = hsvToRgb(hue > 1 ? hue - 1 : hue, 0.8, 1.0);

                for (let i = 0; i < 120; i++) {
                    const angle = i * (Math.PI * 2) / 120;
                    const x = 16 * Math.pow(Math.sin(angle), 3) * scale * baseUnit;
                    const y = -(
                        13 * Math.cos(angle)
                        - 5 * Math.cos(2 * angle)
                        - 2 * Math.cos(3 * angle)
                        - Math.cos(4 * angle)
                    ) * scale * baseUnit;
                    
                    points.push({ x: centerX + x, y: centerY + y, scale, color });
                }
            }

            let drawnCount = 0;
            const pointsPerFrame = 6;
            const labelText = CONFIG.heartText;

            function renderFrame() {
                ctx.fillStyle = "rgba(0, 0, 0, 0.2)"; // Leaves a beautiful trailing ghost effect
                ctx.fillRect(0, 0, width, height);

                if (drawnCount < points.length) {
                    drawnCount = Math.min(drawnCount + pointsPerFrame, points.length);
                }

                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                const fontSize = Math.max(8, Math.round(9 * baseUnit));
                ctx.font = `bold ${fontSize}px Arial`;

                for (let idx = Math.max(0, drawnCount - 120); idx < drawnCount; idx++) {
                    const pt = points[idx];
                    
                    ctx.globalAlpha = 0.8;
                    ctx.fillStyle = pt.color;

                    // Neon Glow on the outer edge
                    if (pt.scale === 16) {
                        ctx.shadowColor = pt.color;
                        ctx.shadowBlur = 10;
                    } else {
                        ctx.shadowBlur = 0;
                    }

                    ctx.fillText(labelText, pt.x, pt.y);
                }

                ctx.shadowBlur = 0;
                ctx.globalAlpha = 1;

                // Once completely drawn, solidify it
                if (drawnCount >= points.length) {
                    // Final static render
                    ctx.fillStyle = "black";
                    ctx.fillRect(0, 0, width, height);
                    for (let idx = 0; idx < points.length; idx++) {
                        const pt = points[idx];
                        ctx.fillStyle = pt.color;
                        if (pt.scale === 16) {
                            ctx.shadowColor = pt.color;
                            ctx.shadowBlur = 8;
                            ctx.font = `bold ${fontSize + 1}px Arial`;
                        } else {
                            ctx.shadowBlur = 0;
                            ctx.globalAlpha = 0.6;
                            ctx.font = `normal ${fontSize - 1}px Arial`;
                        }
                        ctx.fillText(labelText, pt.x, pt.y);
                    }
                    return; // End animation loop
                }

                heartAnimFrameId = requestAnimationFrame(renderFrame);
            }
            renderFrame();
        }

        window.addEventListener('resize', () => {
            if (document.getElementById('heart-stage').style.display === 'block') {
                if (heartAnimFrameId) cancelAnimationFrame(heartAnimFrameId);
                startTurtleHeartAnimation();
            }
        });
    </script>
</body>
</html>
